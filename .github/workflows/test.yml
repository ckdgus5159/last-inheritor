name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check public/app.js
      - run: node --check lib/game.mjs
      - run: node --check lib/rehearsal.mjs
      - run: node --check api/game.js
      - run: npm test
